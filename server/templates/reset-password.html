<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password · Mindful Trim</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0eff5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 32px rgba(108,99,255,0.10);
    }
    .logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .logo-badge {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6C63FF, #9B5DE5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .app-name { font-size: 18px; font-weight: 700; color: #1a1a2e; }
    .app-sub  { font-size: 10px; color: #aaa; letter-spacing: 3px; }
    h1 { font-size: 22px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
    .hint { font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.6; }
    label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    input[type=password], input[type=text] {
      width: 100%;
      height: 52px;
      border: 1.5px solid #e0e0e0;
      border-radius: 12px;
      padding: 0 44px 0 16px;
      font-size: 15px;
      color: #1a1a2e;
      background: #f8f8fb;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #6C63FF; }
    .eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #aaa;
      font-size: 18px;
      line-height: 1;
    }
    .btn {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #6C63FF, #9B5DE5);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { display: none; border-radius: 12px; padding: 14px 16px; font-size: 14px; margin-bottom: 16px; }
    .msg.error   { background: #fff0f0; color: #c0392b; border: 1px solid #f5c6cb; }
    .msg.success { background: #f0fff4; color: #1a7a40; border: 1px solid #c3e6cb; }
    .success-state { display: none; text-align: center; padding: 16px 0; }
    .check-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6C63FF22, #9B5DE522);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin: 0 auto 16px;
    }
    .success-state h2 { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
    .success-state p  { font-size: 14px; color: #666; line-height: 1.6; }
    .invalid-state { text-align: center; padding: 16px 0; }
    .invalid-state h2 { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
    .invalid-state p  { font-size: 14px; color: #666; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <div class="logo-badge">🧘</div>
      <div>
        <div class="app-name">Mindful Trim</div>
        <div class="app-sub">OJAS</div>
      </div>
    </div>

    <!-- Invalid token state -->
    <div class="invalid-state" id="invalidState" style="display:none;">
      <div class="check-icon">⚠️</div>
      <h2>Link Expired</h2>
      <p>This reset link is invalid or has expired.<br>Please request a new one from the app.</p>
    </div>

    <!-- Form state -->
    <div id="formState">
      <h1>Set New Password</h1>
      <p class="hint">Choose a strong password for your Mindful Trim account.</p>

      <div id="errorMsg" class="msg error"></div>

      <label>New Password</label>
      <div class="input-wrap">
        <input type="password" id="newPw" placeholder="At least 6 characters" autocomplete="new-password" />
        <button class="eye-btn" onclick="togglePw('newPw', this)" type="button">👁</button>
      </div>

      <label>Confirm Password</label>
      <div class="input-wrap">
        <input type="password" id="confirmPw" placeholder="Repeat new password" autocomplete="new-password" />
      </div>

      <button class="btn" id="submitBtn" onclick="handleSubmit()">Reset Password</button>
    </div>

    <!-- Success state -->
    <div class="success-state" id="successState">
      <div class="check-icon">✅</div>
      <h2>Password Updated!</h2>
      <p>Your password has been reset successfully.<br>Open the Mindful Trim app and sign in.</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      document.getElementById('formState').style.display = 'none';
      document.getElementById('invalidState').style.display = 'block';
    } else {
      fetch('/api/auth/verify-reset-token/' + token)
        .then(r => r.json())
        .then(data => {
          if (!data.valid) {
            document.getElementById('formState').style.display = 'none';
            document.getElementById('invalidState').style.display = 'block';
          }
        })
        .catch(() => {});
    }

    function togglePw(id, btn) {
      const el = document.getElementById(id);
      if (el.type === 'password') { el.type = 'text'; btn.textContent = '🙈'; }
      else { el.type = 'password'; btn.textContent = '👁'; }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function handleSubmit() {
      const newPw = document.getElementById('newPw').value;
      const confirmPw = document.getElementById('confirmPw').value;
      const btn = document.getElementById('submitBtn');
      document.getElementById('errorMsg').style.display = 'none';

      if (!newPw || newPw.length < 8) { showError('Password must be at least 8 characters.'); return; }
      if (newPw !== confirmPw) { showError('Passwords do not match.'); return; }

      btn.disabled = true;
      btn.textContent = 'Updating…';

      try {
        const res = await fetch('/api/auth/confirm-reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: newPw }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.message || 'Reset failed. The link may have expired.');
          btn.disabled = false;
          btn.textContent = 'Reset Password';
        } else {
          document.getElementById('formState').style.display = 'none';
          document.getElementById('successState').style.display = 'block';
        }
      } catch {
        showError('Network error. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    }
  </script>
</body>
</html>
