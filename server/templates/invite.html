<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accept connection · Mindful Trim</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FAF8F5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 28px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 4px 32px rgba(0,0,0,0.06);
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5B8DEF, #9B7DD4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 600;
      color: #fff;
      margin: 0 auto 20px;
    }
    .name {
      font-size: 22px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 15px;
      color: #666;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      margin-bottom: 12px;
      transition: transform 0.1s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, #56C596, #5B8DEF);
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.92; }
    .btn-secondary {
      background: #f0efe9;
      color: #444;
    }
    .btn-secondary:hover { background: #e8e7e1; }
    .hint {
      font-size: 13px;
      color: #999;
      margin-top: 20px;
      line-height: 1.5;
    }
    .spinner {
      display: none;
      margin: 30px auto;
      width: 28px;
      height: 28px;
      border: 2px solid #ddd;
      border-top-color: #5B8DEF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      body { background: #121218; }
      .card { background: #1c1c24; box-shadow: 0 4px 32px rgba(0,0,0,0.2); }
      .name { color: #f0f0f0; }
      .subtitle { color: #999; }
      .btn-secondary { background: #2a2a34; color: #ccc; }
      .btn-secondary:hover { background: #33333f; }
      .hint { color: #777; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar" id="avatar">F</div>
    <div class="name" id="name">A friend</div>
    <div class="subtitle" id="subtitle">wants to connect with you on<br/><strong>Mindful Trim</strong></div>

    <div class="spinner" id="spinner"></div>

    <a href="#" class="btn btn-primary" id="openBtn">Open in Mindful Trim</a>
    <a href="#" class="btn btn-secondary" id="browserBtn">Continue in browser</a>
    <a href="#" class="btn btn-secondary" id="copyBtn">Copy invite link</a>

    <div class="hint" id="hint">
      Don't have the app installed? No problem — tap "Continue in browser" to accept the connection right now, no download needed.
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);

      // Support both new short-link params (inviterId + name) and legacy base64 param (p)
      let fromName = 'A friend';
      let fromUserId = '';

      const inviterId = params.get('inviterId');
      const nameParam = params.get('name');
      const p = params.get('p');

      if (inviterId) {
        fromUserId = inviterId;
        if (nameParam) fromName = nameParam;
      } else if (p) {
        try {
          const decoded = JSON.parse(atob(p));
          if (decoded.n) fromName = decodeURIComponent(decoded.n);
          if (decoded.u) fromUserId = decoded.u;
        } catch (e) {}
      }

      document.getElementById('name').textContent = fromName;
      document.getElementById('avatar').textContent = (fromName[0] || 'F').toUpperCase();

      // Deep link: always use fromUserId/fromName so the app deep-link parser recognises them
      const deepLinkParams = fromUserId && !p
        ? 'fromUserId=' + encodeURIComponent(fromUserId) + '&fromName=' + encodeURIComponent(fromName)
        : 'p=' + encodeURIComponent(p || '');
      const deepLink = 'mindfultrim://invite?' + deepLinkParams;
      const openBtn = document.getElementById('openBtn');
      openBtn.href = deepLink;

      const browserUrl = fromUserId
        ? location.origin + '/friend-request?fromUserId=' + encodeURIComponent(fromUserId) + '&fromName=' + encodeURIComponent(fromName)
        : location.origin;
      const browserBtn = document.getElementById('browserBtn');
      browserBtn.href = browserUrl;

      const copyBtn = document.getElementById('copyBtn');
      copyBtn.addEventListener('click', function (e) {
        e.preventDefault();
        navigator.clipboard.writeText(location.href).then(function () {
          copyBtn.textContent = 'Copied!';
          setTimeout(function () { copyBtn.textContent = 'Copy invite link'; }, 2000);
        });
      });

      // Try opening the native app automatically on mobile. If the app isn't
      // installed, the OS simply ignores the custom scheme (no error, no crash) —
      // after a short delay we reveal the fallback options (browser + copy link)
      // so the friend can still connect without needing to install anything.
      const ua = navigator.userAgent;
      const isMobile = /iPhone|iPad|iPod|Android/i.test(ua);
      if (isMobile) {
        document.getElementById('spinner').style.display = 'block';
        openBtn.style.display = 'none';
        browserBtn.style.display = 'none';
        copyBtn.style.display = 'none';
        window.location.href = deepLink;
        setTimeout(function () {
          document.getElementById('spinner').style.display = 'none';
          openBtn.style.display = 'block';
          browserBtn.style.display = 'block';
          copyBtn.style.display = 'block';
        }, 800);
      }
    })();
  </script>
</body>
</html>
